<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg:#0b0f14;
      --text:#eaf0ff;
      --muted:#9aa9c3;
      --panelA: rgba(17,24,37,0.45);
      --panelB: rgba(14,19,30,0.38);
      --line: rgba(255,255,255,0.08);
      --accent: #c7df3a;
      --accentText:#0b0f14;
      --ink: #111;
    }
    html, body { height:100%; margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { position:absolute; inset:0; }

    .panel {
      position:absolute; left:20px; top:20px; z-index:5;
      background: linear-gradient(180deg, var(--panelA), var(--panelB));
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      width: min(360px, calc(100vw - 40px));
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      max-height: 460px;
      transition: max-height .3s ease;
    }
    .panel.collapsed { max-height: 54px; padding: 10px 12px; }

    .title {
      font-weight: 600; color: var(--ink);
      margin: 0; padding: 6px 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer;
    }
    .toggle-icon { font-size: 12px; margin-left: 10px; transition: transform .25s ease; }
    .panel.collapsed .toggle-icon { transform: rotate(180deg); }

    .muted { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .row { display:flex; flex-direction:column; gap:8px; margin-top:8px; width:100%; }
    .panel.collapsed .muted, .panel.collapsed .row { display:none; }

    .input-button-group {
      width:100%; max-width: 240px;
      display:flex; flex-direction: column; gap: 12px;
      align-items:center; margin: 0 auto;
    }

    /* Buttons in einer Reihe + zentriert */
    .button-group {
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 10px;
      margin: 0 auto;
      flex-wrap: nowrap;
    }

    input {
      width:100%;
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 14px;
      color: #e5e7eb;
      text-align: center;
    }

    button {
      background: rgba(199,223,58,0.78);
      color: var(--accentText);
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 12.5px;
      border: none;
      cursor:pointer;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    button.secondary {
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      color: #e5e7eb;
      backdrop-filter: blur(10px);
    }

    .stat {
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      display:flex;
      justify-content:space-between;
      gap:8px;
      opacity:0.85;
    }

    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ef4444; margin-right:6px; }
    .dot.on { background:#22c55e; }

    .marker {
      width:18px; height:18px; border-radius:50%;
      background: rgba(199,223,58,0.92);
      border: 2px solid rgba(199,223,58,0.35);
      box-shadow: 0 10px 22px rgba(0,0,0,.35), 0 0 18px rgba(199,223,58,0.36);
    }
    .marker.stale { opacity: 0.6 !important; background: rgba(199,223,58,0.4) !important; }

    /* HINT (zweizeilig split) */
    .stat-top { align-items: center; }
.hint-top {
  flex: 1;
  text-align: center;
  color: #00FF00;
  font-size: 11.5px;      /* kleiner, ruhiger */
  font-weight: 500;       /* weniger dominant */
  line-height: 1.2;
  padding: 0 8px;
  display: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

    .hint-top.show { display:block; }

    .hint-bottom {
      margin-top: 6px;
      text-align: center;
      color: #00FF00;
      font-size: 12.5px;
      font-weight: 500;
      display: none;
    }
    .hint-bottom.show { display:block; }

    /* Eingeklappt: Hint + letztes Update NICHT sichtbar */
    .panel.collapsed .hint-top,
    .panel.collapsed .hint-bottom,
    .panel.collapsed #lastRow {
      display: none !important;
    }

    @media (max-width: 900px) {
      .panel { left:12px; top:12px; right:12px; width:auto; }
      input { height: 40px; font-size: 15px; }
      button { height: 36px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel collapsed">
    <p class="title" id="panelTitle">EcoRide – Live-Karte <span class="toggle-icon" aria-hidden="true">▼</span></p>

    <div class="row">
      <div class="input-button-group">
        <input id="driverFilter" placeholder="Driver ID" />
      </div>

      <div class="button-group">
        <button id="btnApply">Anwenden</button>
        <button id="btnAll" class="secondary">Alle</button>
        <button id="btnToggleRoutes" class="secondary">Routen</button>
        <button id="btnActiveOnly" class="secondary">Nur aktive</button>
      </div>
    </div>

    <!-- Realtime / Hint (oben) / Marker -->
    <div class="stat stat-top">
      <div><span id="rtDot" class="dot"></span><span id="rtTxt">Realtime: AUS</span></div>

      <!-- Hint Zeile 1 (kurz, in der Realtime-Zeile) -->
      <div id="hintTop" class="hint-top"></div>

      <div><span id="countTxt">Marker: 0</span></div>
    </div>

    <!-- Hint Zeile 2 (lang, zwischen Realtime/Marker und Letztes Update) -->
    <div id="hintBottom" class="hint-bottom"></div>

    <!-- Letztes Update -->
    <div class="stat" id="lastRow">
      <div>Letztes Update:</div>
      <div id="lastTxt">–</div>
    </div>
  </div>

  <script>
    // --- 1. Konfiguration & Debug-Modus ---
    const DEBUG = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

    // API-Keys
    const MAPBOX_TOKEN = "MAPBOX_TOKEN_PLACEHOLDER";
    const SUPABASE_URL = "https://ihpszsoivqcrkkiucjvv.supabase.co";
    const SUPABASE_ANON_KEY = "SUPABASE_KEY_PLACEHOLDER";

    // --- Klare Zeitfenster ---
    const ACTIVE_ONLY_MS = 2 * 60_000;   // 2 Min. für "Nur aktive"
    const STALE_VISUAL_MS = 2 * 60_000;  // 2 Min. für visuelle Hinweise
    const STALE_MS = 5 * 60_000;         // 5 Min. für Marker/Routen-Lebensdauer
    const PRUNE_EVERY_MS = 10_000;       // Alle 10 Sekunden prüfen
    const ROUTE_MS = 10 * 60_000;        // 10 Minuten Route anzeigen
    const MAX_POINTS = 200;              // Max. Punkte pro Fahrer

    // --- Phase 2.1: Farben für Routen (stabil) ---
    const ROUTE_COLORS = ["#c7df3a", "#3bb2d0", "#ff6b6b", "#a55eea", "#4dabf7", "#f06595", "#ffd43b", "#7bed9f"];

    // --- 2. Helper-Funktionen ---
    function setSafeTextContent(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text ?? "";
      else if (DEBUG) console.warn(`[DEBUG] Element #${id} nicht gefunden!`);
    }

    function logDebug(...args) { if (DEBUG) console.log("[DEBUG]", ...args); }
    function logError(...args) { console.error("[ERROR]", ...args); }

    // --- Hint split (oben kurz / unten lang) ---
    function showHint(msg) {
      const top = document.getElementById("hintTop");
      const bottom = document.getElementById("hintBottom");
      if (!top || !bottom) return;

      const s = String(msg || "").trim();
      if (!s) return;

      // Split: alles vor erster "(" nach oben, Rest nach unten
      const i = s.indexOf("(");
      const topText = (i >= 0 ? s.slice(0, i).trim() : s);
      const bottomText = (i >= 0 ? s.slice(i).trim() : "");

      top.textContent = topText;
      bottom.textContent = bottomText;

      top.classList.toggle("show", !!topText);
      bottom.classList.toggle("show", !!bottomText);
    }

    function hideHint() {
      const top = document.getElementById("hintTop");
      const bottom = document.getElementById("hintBottom");
      if (top) { top.classList.remove("show"); top.textContent = ""; }
      if (bottom) { bottom.classList.remove("show"); bottom.textContent = ""; }
    }

    // --- Konsistenz: cutoffOverride normalisieren ---
    function normalizeCutoff(cutoffOverride, fallbackIso) {
      if (!cutoffOverride) return fallbackIso;
      if (typeof cutoffOverride === "number") return new Date(cutoffOverride).toISOString();
      return String(cutoffOverride);
    }

    // --- Phase 2.1: Farbe pro Fahrer (stabil) ---
    function getColorForDriver(driverKey) {
      let hash = 0;
      for (let i = 0; i < driverKey.length; i++) {
        hash = driverKey.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % ROUTE_COLORS.length;
      return ROUTE_COLORS[index];
    }

    // --- 3. Mapbox-Initialisierung ---
    function initMapbox() {
      if (!MAPBOX_TOKEN || MAPBOX_TOKEN.includes("DEIN_MAPBOX_TOKEN")) {
        showHint("Mapbox Token fehlt. Bitte MAPBOX_TOKEN in map.html setzen.");
        logError("MAPBOX_TOKEN ist nicht gesetzt.");
        return null;
      }

      mapboxgl.accessToken = MAPBOX_TOKEN;

      const map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/streets-v12",
        center: [8.8, 53.1], // Bremen
        zoom: 10,
      });

      map.addControl(new mapboxgl.NavigationControl(), "bottom-right");

      map.on("load", () => {
        logDebug("Karte erfolgreich geladen");
        hideHint();

        if (!map.getSource("er-routes")) {
          map.addSource("er-routes", {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] }
          });

          map.addLayer({
            id: "er-routes-line",
            type: "line",
            source: "er-routes",
            layout: {
              "line-join": "round",
              "line-cap": "round",
              "visibility": routesVisible ? "visible" : "none"
            },
            paint: {
              "line-width": 4,
              "line-opacity": 0.75,
              "line-color": ["get", "color"]
            }
          });

          map.on("click", "er-routes-line", (e) => {
            const driverKey = e.features[0].properties.driverKey;
            new mapboxgl.Popup()
              .setLngLat(e.lngLat)
              .setHTML(`<b>Fahrer:</b> ${driverKey}<br><b>Route der letzten 10 Minuten</b>`)
              .addTo(map);
          });

          map.on("mouseenter", "er-routes-line", () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", "er-routes-line", () => { map.getCanvas().style.cursor = ""; });
        }

        const btn = document.getElementById("btnToggleRoutes");
        if (btn) btn.textContent = routesVisible ? "Routen ausblenden" : "Routen anzeigen";

        routesReady = true;
        refreshRoutesSource();
      });

      map.on("error", (e) => {
        logError("Mapbox-Fehler:", e?.error || e);
        showHint("Karte konnte nicht geladen werden. Prüfe Token/Internetverbindung.");
      });

      return map;
    }

    // --- 4. Supabase-Client & Globale Variablen ---
    if (!SUPABASE_URL || SUPABASE_URL.includes("DEINE_SUPABASE_URL") || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("DEIN_SUPABASE_ANON_KEY")) {
      showHint("Supabase Config fehlt. Bitte SUPABASE_URL & SUPABASE_ANON_KEY in map.html setzen.");
      logError("SUPABASE_URL / SUPABASE_ANON_KEY sind nicht gesetzt.");
    }

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map;
    let channel = null;

    const markers = new Map();    // driverKey -> mapboxgl.Marker
    const lastSeen = new Map();   // driverKey -> timestamp(ms)

    const routePoints = new Map(); // driverKey -> Array<{lng,lat,ts}>
    let routesReady = false;
    let routesVisible = true;
    let activeOnlyMode = false;

    let currentFilter = "";
    let currentFilterKey = "";

    // --- 5. UI-Funktionen ---
    function setRealtime(on) {
      const rtDot = document.getElementById("rtDot");
      const rtTxt = document.getElementById("rtTxt");
      if (rtDot) rtDot.classList.toggle("on", on);
      if (rtTxt) rtTxt.textContent = "Realtime: " + (on ? "AN" : "AUS");
    }

    function setLast() {
      setSafeTextContent("lastTxt", new Date().toLocaleString("de-DE"));
    }

    function setCount(n) {
      setSafeTextContent("countTxt", "Marker: " + n);
    }

    function normId(v) { return String(v ?? "").trim().toLowerCase(); }

    // --- Phase 2.1: write routes to map source ---
    function refreshRoutesSource() {
      if (!map || !routesReady || !map.getSource("er-routes")) return;

      const features = [];
      for (const [driverKey, pts] of routePoints.entries()) {
        if (!pts || pts.length < 2) continue;
        if (currentFilterKey && driverKey !== currentFilterKey) continue;

        features.push({
          type: "Feature",
          properties: {
            driverKey,
            color: getColorForDriver(driverKey)
          },
          geometry: {
            type: "LineString",
            coordinates: pts.map(p => [p.lng, p.lat])
          }
        });
      }

      const src = map.getSource("er-routes");
      if (src) src.setData({ type: "FeatureCollection", features });

      if (features.length === 0 && currentFilterKey && routePoints.size === 0) {
        showHint("Keine Route für diesen Fahrer (zu wenige Datenpunkte).");
      } else if (features.length === 0) {
        showHint("Keine Routen verfügbar (zu wenige Datenpunkte).");
      } else {
        hideHint();
      }
    }

    // --- 6. Initialisierung ---
    function initMap() {
      map = initMapbox();
      if (!map) return;

      document.getElementById("panelTitle")?.addEventListener("click", () => {
        document.querySelector(".panel")?.classList.toggle("collapsed");
      });

      document.getElementById("btnApply")?.addEventListener("click", async () => {
        const df = document.getElementById("driverFilter");
        currentFilter = df?.value?.trim() || "";
        currentFilterKey = normId(currentFilter);
        await fetchLatest();
        await fetchRouteHistory();
      });

      document.getElementById("btnAll")?.addEventListener("click", async () => {
        const df = document.getElementById("driverFilter");
        if (df) df.value = "";
        currentFilter = "";
        currentFilterKey = "";
        await fetchLatest();
        await fetchRouteHistory();
      });

      document.getElementById("btnToggleRoutes")?.addEventListener("click", () => {
        routesVisible = !routesVisible;
        if (map && map.getLayer("er-routes-line")) {
          map.setLayoutProperty("er-routes-line", "visibility", routesVisible ? "visible" : "none");
        }
        const btn = document.getElementById("btnToggleRoutes");
        if (btn) btn.textContent = routesVisible ? "Routen ausblenden" : "Routen anzeigen";
      });

      document.getElementById("btnActiveOnly")?.addEventListener("click", async () => {
        activeOnlyMode = !activeOnlyMode;
        const btn = document.getElementById("btnActiveOnly");
        if (btn) btn.textContent = activeOnlyMode ? "Alle anzeigen" : "Nur aktive";

        showHint(activeOnlyMode
          ? "Nur aktive Fahrer werden angezeigt (letzte 2 Minuten)."
          : "Alle Fahrer werden angezeigt.");

        await fetchLatest();
        await fetchRouteHistory();
      });

      fetchLatest().catch(e => logError("Initial fetchLatest() fehlgeschlagen:", e));
      fetchRouteHistory().catch(e => logError("Initial fetchRouteHistory() fehlgeschlagen:", e));

      subscribe();
    }

    // --- 7. Initial Load: nur aktive Fahrer (Marker) ---
    async function fetchLatest(cutoffOverride) {
      const now = Date.now();
      const fallbackIso = new Date(now - (activeOnlyMode ? ACTIVE_ONLY_MS : STALE_MS)).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);

      const { data, error } = await sb
        .from("live_positions")
        .select("driver_id, lat, lng, updated_at")
        .gte("updated_at", cutoffIso)
        .order("updated_at", { ascending: false })
        .limit(200);

      if (error) {
        logError("Supabase-Fehler:", error.message);
        showHint("Fehler beim Laden der Daten (bitte Seite neu laden).");
        return;
      }

      const seen = new Set();
      const newMarkers = new Map();

      for (const row of data || []) {
        const driverKey = normId(row?.driver_id);
        if (!driverKey || seen.has(driverKey)) continue;
        seen.add(driverKey);
        newMarkers.set(driverKey, row);
      }

      for (const [driverKey] of markers.entries()) {
        if (!newMarkers.has(driverKey)) removeMarker(driverKey);
      }

      for (const [, row] of newMarkers.entries()) {
        upsertMarker(row);
      }

      setLast();
    }

    // --- Phase 2.1: History Load (ohne SQL-Filter, nur JS-Filter) ---
    async function fetchRouteHistory(cutoffOverride) {
      const now = Date.now();
      const fallbackIso = new Date(now - (activeOnlyMode ? ACTIVE_ONLY_MS : ROUTE_MS)).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);

      const { data, error } = await sb
        .from("live_positions")
        .select("driver_id, lat, lng, updated_at")
        .gte("updated_at", cutoffIso)
        .order("driver_id", { ascending: true })
        .order("updated_at", { ascending: true });

      if (error) {
        logError("Route-History Fehler:", error.message);
        return;
      }

      routePoints.clear();

      for (const row of data || []) {
        const driverKey = normId(row?.driver_id);
        if (!driverKey) continue;
        if (currentFilterKey && driverKey !== currentFilterKey) continue;

        const lat = Number(row.lat);
        const lng = Number(row.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

        const ts = row.updated_at ? new Date(row.updated_at).getTime() : null;
        if (!ts) continue;

        const arr = routePoints.get(driverKey) ?? [];
        arr.push({ lng, lat, ts });
        routePoints.set(driverKey, arr);
      }

      for (const [driverKey, arr] of routePoints.entries()) {
        const minTs = now - ROUTE_MS;
        while (arr.length && arr[0].ts < minTs) arr.shift();
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);

        const last = arr[arr.length - 1];
        if (!last || (now - last.ts > STALE_MS) || arr.length < 2) {
          routePoints.delete(driverKey);
        }
      }

      refreshRoutesSource();
    }

    // --- 8. Realtime: patch statt reset ---
    function subscribe() {
      if (channel) sb.removeChannel(channel);

      channel = sb.channel("live_positions_map")
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "live_positions"
        }, (payload) => {
          if (payload?.eventType === "INSERT" || payload?.eventType === "UPDATE") {
            upsertMarker(payload.new);
          } else if (payload?.eventType === "DELETE") {
            removeMarker(normId(payload.old?.driver_id));
          }
        })
        .subscribe((status) => {
          setRealtime(status === "SUBSCRIBED");
          if (status !== "SUBSCRIBED") logDebug("Realtime-Status:", status);
        });
    }

    // --- 9. Marker-Logik + Route Update (mit visuellen Hinweisen und Auto-Follow) ---
    function upsertMarker(row) {
      if (!map || !row?.driver_id) return;

      const driverKey = normId(row.driver_id);
      if (!driverKey) return;
      if (currentFilterKey && driverKey !== currentFilterKey) return;

      const lat = Number(row.lat);
      const lng = Number(row.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        logError("Ungültige Koordinaten für Driver:", driverKey, row);
        return;
      }

      const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
      const age = Date.now() - ts;

      if (age > STALE_MS) {
        logDebug(`Stale Update für ${driverKey} ignoriert (kein Löschen).`);
        return;
      }

      const timeStr = row.updated_at ? new Date(row.updated_at).toLocaleTimeString("de-DE") : "–";

      let marker = markers.get(driverKey);
      if (!marker) {
        const el = document.createElement("div");
        el.className = "marker";
        marker = new mapboxgl.Marker({ element: el })
          .setLngLat([lng, lat])
          .setPopup(new mapboxgl.Popup({ offset: 18 }).setHTML(`
            <div class="er-popup">
              <span class="er-tag">LIVE</span>
              <div class="er-row">👤 Fahrer: <b>${row.driver_id}</b></div>
              <div class="er-row">📍 Position: ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
              <div class="er-row">⏱️ Letztes Update: ${timeStr}</div>
            </div>
          `))
          .addTo(map);
        markers.set(driverKey, marker);
      } else {
        marker.setLngLat([lng, lat]);
      }

      if (age > STALE_VISUAL_MS) marker.getElement().classList.add("stale");
      else marker.getElement().classList.remove("stale");

      // Auto-Follow für ausgewählten Fahrer
      if (currentFilterKey === driverKey && map.getZoom() > 12) {
        map.easeTo({ center: [lng, lat], duration: 600 });
      }

      lastSeen.set(driverKey, ts);
      setCount(markers.size);
      setLast();

      // Route-Logik
      const now = Date.now();
      const minTs = now - ROUTE_MS;
      const arr = routePoints.get(driverKey) ?? [];
      arr.push({ lng, lat, ts });
      while (arr.length && arr[0].ts < minTs) arr.shift();
      if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
      routePoints.set(driverKey, arr);
      refreshRoutesSource();
    }

    function removeMarker(driverKey) {
      if (!driverKey) return;
      const marker = markers.get(driverKey);
      if (marker) {
        marker.remove();
        markers.delete(driverKey);
      }
      lastSeen.delete(driverKey);
      routePoints.delete(driverKey);
      refreshRoutesSource();
      setCount(markers.size);
    }

    // --- 10. TTL-Check / Pruning ---
    setInterval(() => {
      if (lastSeen.size === 0) return;
      const now = Date.now();
      const staleKeys = [];
      for (const [driverKey, ts] of lastSeen.entries()) {
        if (now - ts > STALE_MS) staleKeys.push(driverKey);
      }
      staleKeys.forEach(driverKey => removeMarker(driverKey));
    }, PRUNE_EVERY_MS);

    // --- 11. Start ---
    document.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
