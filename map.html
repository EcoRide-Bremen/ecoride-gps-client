<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase (global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root{
      --bg:#0b0f14; --card:#111825; --text:#eaf0ff; --muted:#93a4bf; --line:#1f2a3d;
      --accent:#a855f7;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #map {
      position: absolute;
      inset: 0;
    }

    .panel {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 5;
      background: rgba(17, 24, 37, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 12px;
      width: min(380px, calc(100vw - 24px));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: max-height 0.3s ease;
      overflow: hidden;
      max-height: 400px;
    }

    .panel.collapsed {
      max-height: 40px;
    }

    .title {
      font-weight: 800;
      letter-spacing: .2px;
      margin: 0;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
    }

    .toggle-icon {
      font-size: 12px;
      transition: transform 0.3s ease;
      margin-left: 8px;
    }

    .panel.collapsed .toggle-icon {
      transform: rotate(180deg);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 0;
      line-height: 1.35;
    }

    .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }

    .row > div {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 300px;
    }

    input {
      flex: 1;
      background: #0c1220;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 10px;
      border-radius: 10px;
      outline: none;
    }

    button {
      background: var(--accent);
      border: 0;
      color: white;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    button.secondary {
      background: #27324a;
    }

    .stat {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }

    .dot.on {
      background: #22c55e;
    }

    .marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid white;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .hint {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 12px;
      display: none;
    }

    .hint.show {
      display: block;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Popup-Stil */
    .mapboxgl-popup-content {
      background: #ffffff !important;
      color: #0b0f14 !important;
      border-radius: 14px !important;
      padding: 12px 14px !important;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35) !important;
      font-size: 14px !important;
    }

    .mapboxgl-popup-close-button {
      color: #0b0f14 !important;
