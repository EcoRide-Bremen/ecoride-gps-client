<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase (global: window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root{
      --bg:#0b0f14; --card:#111825; --text:#eaf0ff; --muted:#93a4bf; --line:#1f2a3d;
      --accent:#a855f7;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #map {
      position: absolute;
      inset: 0;
    }

    .panel {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 5;
      background: rgba(17, 24, 37, 0.5);
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      width: min(350px, calc(100vw - 40px));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: max-height 0.3s ease, padding 0.3s ease;
      overflow: hidden;
      max-height: 400px;
    }

    .panel.collapsed {
      max-height: 48px;
      padding: 6px 12px;
    }

    .title {
      font-weight: 600;
      letter-spacing: .2px;
      margin: 0;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .toggle-icon {
      font-size: 12px;
      transition: transform 0.3s ease;
      margin-left: 8px;
    }

    .panel.collapsed .toggle-icon {
      transform: rotate(180deg);
    }

    .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      width: 100%;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .panel.collapsed .row {
      display: none;
    }

    .input-button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
      align-items: center;
    }

    input {
      width: 100%;
      background: rgba(12, 18, 32, 0.6);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      outline: none;
      text-align: center;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    input::placeholder {
      color: var(--muted);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    button {
      background: var(--accent);
      border: 0;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    button.secondary {
      background: rgba(39, 50, 74, 0.7);
    }

    .stat {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .panel.collapsed .stat {
      display: none;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }

    .dot.on {
      background: #22c55e;
    }

    .marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid white;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .hint {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 12px;
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .hint.show {
      display: block;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Popup-Stil */
    .mapboxgl-popup-content {
      background: #ffffff !important;
      color: #0b0f14 !important;
      border-radius: 14px !important;
      padding: 12px 14px !important;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35) !important;
      font-size: 14px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif !important;
    }

    .mapboxgl-popup-close-button {
      color: #0b0f14 !important;
      font-size: 18px !important;
    }

    .mapboxgl-popup-tip {
      border-top-color: #ffffff !important;
    }

    .er-popup {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.35;
    }

    .er-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ffeaa7;
      color: #111;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .er-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .er-row b {
      font-weight: 800;
    }

    /* Mobile Anpassungen */
    @media (max-width: 900px) {
      .panel {
        left: 20px;
        right: 20px;
        width: auto;
        background: rgba(17, 24, 37, 0.5);
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel collapsed">
    <p class="title">
      EcoRide – Live-Karte
      <span class="toggle-icon">▼</span>
    </p>

    <div class="row">
      <div class="input-button-group">
        <input id="driverFilter" placeholder="Driver ID" />
      </div>
      <div class="button-group">
        <button id="btnApply">Anwenden</button>
        <button id="btnAll" class="secondary">Alle</button>
      </div>
    </div>

    <div class="stat">
      <div><span id="rtDot" class="dot"></span><span id="rtTxt">Realtime: AUS</span></div>
      <div><span id="countTxt">Marker: 0</span></div>
    </div>

    <div class="stat">
      <div>Letztes Update:</div>
      <div id="lastTxt">–</div>
    </div>

    <div id="hint" class="hint"></div>
  </div>
