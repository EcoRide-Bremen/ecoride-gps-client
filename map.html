<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg:#0b0f14;
      --text:#eaf0ff;
      --muted:#9aa9c3;
      --panelA: rgba(17,24,37,0.45);
      --panelB: rgba(14,19,30,0.38);
      --line: rgba(255,255,255,0.08);
      --accent: #c7df3a;
      --accentText:#0b0f14;
      --ink: #111;
    }
    html, body { height:100%; margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { position:absolute; inset:0; }

    /* ... (Rest deines CSS bleibt unverändert) ... */

    /* ===== EcoRide Pin ===== */
    .marker-pin {
      width: 34px;
      height: 46px;
      transform: translateY(-2px);
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      cursor: pointer;
    }
    .marker-pin svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .marker-pin .pin-body {
      fill: #7CB342; /* Grünton wie im Beispiel */
      stroke: rgba(124, 179, 66, 0.28);
      stroke-width: 2;
    }
    .marker-pin .pin-inner {
      fill: white;
      stroke: rgba(11, 15, 20, 0.1);
      stroke-width: 1;
    }
    .marker-pin .pin-text {
      fill: #0b0f14;
      font-family: Arial, sans-serif;
      font-size: 8px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .marker-pin.stale {
      opacity: 0.65;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.25));
    }
    .marker-pin.stale .pin-body {
      fill: rgba(124, 179, 66, 0.45);
      stroke: rgba(124, 179, 66, 0.18);
    }
    .marker-pin:hover {
      transform: translateY(-4px);
      transition: transform 0.15s ease;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel collapsed">
    <p class="title" id="panelTitle">EcoRide – Live-Karte <span class="toggle-icon" aria-hidden="true">▼</span></p>

    <div class="row">
      <div class="input-button-group">
        <input id="driverFilter" placeholder="Driver ID" />
      </div>

      <div class="button-group">
        <button id="btnApply">Folgen</button>
        <button id="btnAll" class="secondary">Aufheben</button>
        <button id="btnToggleRoutes" class="secondary">Einblenden</button>
        <button id="btnActiveOnly" class="secondary">Aktive</button>
      </div>
    </div>

    <div class="stat">
      <div class="left">
        <span id="rtDot" class="dot"></span>
        <span id="rtTxt">Realtime: AUS</span>
      </div>

      <div class="mid">
        <span id="hintInline" class="hint-inline"></span>
      </div>

      <div class="right">
        <span id="countTxt">Marker: 0</span>
      </div>
    </div>

    <div class="stat2">
      <div class="last-left">
        <span>Letztes Update:</span>
        <span id="syncIcon" class="sync" title="Aktualisiere…">⟳</span>
      </div>
      <div id="lastTxt">–</div>
    </div>

    <div class="stat3">
      <div>Aktiv: <span id="impactActive" class="pulse">–</span></div>
      <div>Punkte 10m: <span id="impactPoints10" class="pulse">–</span></div>
      <div>Marker: <span id="impactMarkers" class="pulse">0</span></div>
    </div>
  </div>

  <script>
    // --- 1. Konfiguration & Debug-Modus ---
    const DEBUG = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

    // API-Keys
    const MAPBOX_TOKEN = "MAPBOX_TOKEN_PLACEHOLDER";
    const SUPABASE_URL = "https://ihpszsoivqcrkkiucjvv.supabase.co";
    const SUPABASE_ANON_KEY = "SUPABASE_KEY_PLACEHOLDER";

    // --- Zeitfenster ---
    const ACTIVE_ONLY_MS = 2 * 60_000;
    const STALE_VISUAL_MS = 2 * 60_000;
    const STALE_MS = 5 * 60_000;
    const PRUNE_EVERY_MS = 10_000;
    const ROUTE_MS = 10 * 60_000;
    const MAX_POINTS = 200;

    // --- Phase 2.1: Farben für Routen (stabil) ---
    const ROUTE_COLORS = ["#c7df3a", "#3bb2d0", "#ff6b6b", "#a55eea", "#4dabf7", "#f06595", "#ffd43b", "#7bed9f"];

    // --- Helper-Funktionen bleiben unverändert ---

    function createEcoRidePin(stale = false) {
      const el = document.createElement("div");
      el.className = "marker-pin" + (stale ? " stale" : "");
      el.innerHTML = `
        <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
          <!-- Pin-Körper (grüner Hintergrund) -->
          <path class="pin-body" d="M32 2C20 2 10 12 10 24C10 43 32 78 32 78C32 78 54 43 54 24C54 12 44 2 32 2Z" />

          <!-- Weißer Kreis in der Mitte -->
          <circle class="pin-inner" cx="32" cy="26" r="16" />

          <!-- "EcoRide"-Text -->
          <text class="pin-text" x="32" y="26">EcoRide</text>
        </svg>
      `;
      return el;
    }

    // --- Rest des JavaScript-Codes bleibt unverändert ---
    function upsertMarker(row) {
      if (!map || !row?.driver_id) return;

      const driverKey = normId(row.driver_id);
      if (!driverKey) return;
      if (currentFilterKey && driverKey !== currentFilterKey) return;

      const lat = Number(row.lat);
      const lng = Number(row.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

      const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
      const age = Date.now() - ts;
      if (age > STALE_MS) return;

      let marker = markers.get(driverKey);

      if (!marker) {
        const el = createEcoRidePin(false);

        marker = new mapboxgl.Marker({
          element: el,
          anchor: "bottom"
        })
        .setLngLat([lng, lat])
        .addTo(map);

        markers.set(driverKey, marker);

      } else {
        marker.setLngLat([lng, lat]);
      }

      if (age > STALE_VISUAL_MS) marker.getElement().classList.add("stale");
      else marker.getElement().classList.remove("stale");

      lastSeen.set(driverKey, ts);
      setCount(markers.size);
      setLast(new Date());

      const now = Date.now();
      const minTs = now - ROUTE_MS;
      const arr = routePoints.get(driverKey) ?? [];
      arr.push({ lng, lat, ts });
      while (arr.length && arr[0].ts < minTs) arr.shift();
      if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
      routePoints.set(driverKey, arr);

      refreshRoutesSource();

      setImpactMarkers();
      const sinceOk = Date.now() - (lastImpactOkAt || 0);
      if (shouldPollImpact() && sinceOk > 3000) {
        fetchImpactOnce("event").catch(() => {});
      }
    }

    // --- Rest des Codes bleibt unverändert ---
    document.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
