<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide – Live-Karte</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg:#0b0f14;
      --text:#eaf0ff;
      --muted:#9aa9c3;
      --panelA: rgba(17,24,37,0.45);
      --panelB: rgba(14,19,30,0.38);
      --line: rgba(255,255,255,0.08);
      --accent: #c7df3a;
      --accentText:#0b0f14;
      --ink: #111;
    }
    html, body { height:100%; margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { position:absolute; inset:0; }

    .panel {
      position:absolute; left:20px; top:20px; z-index:5;
      background: linear-gradient(180deg, var(--panelA), var(--panelB));
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      width: min(360px, calc(100vw - 40px));
      min-width: 320px;
      max-height: 520px;
      transition: max-height .3s ease;
    }
    .panel.collapsed { max-height: 54px; padding: 10px 12px; }

    .title {
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      padding: 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .toggle-icon { font-size: 12px; margin-left: 10px; transition: transform .25s ease; }
    .panel.collapsed .toggle-icon { transform: rotate(180deg); }

    .row {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
      width:100%;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .panel.collapsed .row,
    .panel.collapsed .stat,
    .panel.collapsed .stat2,
    .panel.collapsed .stat3 { display:none !important; }

    .input-button-group {
      width:100%;
      max-width: 260px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items:center;
      margin: 0 auto;
    }

    input {
      width:100%;
      max-width: 180px;
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 14px;
      color: #e5e7eb;
      text-align: center;
    }

    .button-group {
      width:100%;
      display:flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      padding: 0 20px;
      box-sizing: border-box;
      margin: 0 auto;
    }
    .button-group::-webkit-scrollbar { height: 0px; }

    button {
      background: rgba(199,223,58,0.78);
      color: var(--accentText);
      height: 32px;
      min-width: 80px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 12.5px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button.secondary {
      background: rgba(17,24,37,0.28);
      border: 1px solid rgba(199,223,58,0.18);
      color: #e5e7eb;
      backdrop-filter: blur(10px);
    }

    .stat {
      margin-top:10px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      column-gap: 10px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .stat .left { justify-self: start; display:flex; align-items:center; gap:6px; }
    .stat .mid {
      justify-self: center;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-width:0;
    }
    .stat .right { justify-self: end; }

    .stat2 {
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding: 0 10px;
      box-sizing: border-box;
      align-items: center;
    }
    .last-left { display:flex; align-items:center; gap:8px; }

    .sync {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(199,223,58,0.22);
      color: rgba(199,223,58,0.95);
      font-size: 12px;
      opacity: 0.0;
      transform: rotate(0deg);
      transition: opacity .15s ease;
      user-select: none;
    }
    .sync.on { opacity: 1.0; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stat3{
      margin-top:8px;
      font-size:12.5px;
      color: var(--ink);
      opacity:0.85;
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding: 0 10px;
      box-sizing: border-box;
      flex-wrap: nowrap;
    }

    .pulse { display:inline-block; padding: 0 6px; border-radius: 999px; transition: background-color .35s ease; }
    .pulse.flash { background: rgba(199,223,58,0.22); }

    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ef4444; }
    .dot.on { background:#22c55e; }

    .hint-inline {
      display:none;
      color:#00FF00;
      font-size:12px;
      line-height:1.15;
      font-weight:600;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
      white-space: normal;
      word-break: break-word;
      max-width: 190px;
      text-align: center;
    }
    .hint-inline.show { display:block; }

    .mapboxgl-popup-content {
      background: rgba(17,24,37,0.92);
      color: #eaf0ff;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(0,0,0,.40);
      padding: 10px 10px 8px;
      backdrop-filter: blur(10px);
      min-width: 210px;
    }
    .mapboxgl-popup-tip {
      border-top-color: rgba(17,24,37,0.92) !important;
      border-bottom-color: rgba(17,24,37,0.92) !important;
    }
    .er-pop-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      margin: 0 0 6px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .er-pop-sub {
      font-size: 12px;
      color: rgba(234,240,255,0.78);
      margin: 0 0 8px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .er-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      white-space: nowrap;
    }
    .er-badge.ok { border-color: rgba(34,197,94,0.35); }
    .er-badge.stale { border-color: rgba(239,68,68,0.35); }

    .er-pop-actions { display:flex; gap: 8px; margin-top: 8px; }
    .er-pop-btn {
      flex:1;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(199,223,58,0.18);
      background: rgba(17,24,37,0.35);
      color: #eaf0ff;
      font-size: 12px;
      cursor: pointer;
    }
    .er-pop-btn.primary {
      background: rgba(199,223,58,0.85);
      color: #0b0f14;
      border: none;
    }

    @media (max-width: 900px) {
      .panel { left:12px; top:12px; right:12px; width:auto; min-width: 280px; }
      input { height: 40px; font-size: 15px; }
      button { height: 36px; font-size: 14px; }
      .hint-inline { max-width: 160px; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel collapsed">
    <p class="title" id="panelTitle">EcoRide – Live-Karte <span class="toggle-icon" aria-hidden="true">▼</span></p>

    <div class="row">
      <div class="input-button-group">
        <input id="driverFilter" placeholder="Driver ID" />
      </div>

      <div class="button-group">
        <button id="btnApply">Folgen</button>
        <button id="btnAll" class="secondary">Aufheben</button>
        <button id="btnToggleRoutes" class="secondary">Einblenden</button>
        <button id="btnActiveOnly" class="secondary">Aktive</button>
      </div>
    </div>

    <div class="stat">
      <div class="left">
        <span id="rtDot" class="dot"></span>
        <span id="rtTxt">Realtime: AUS</span>
      </div>

      <div class="mid">
        <span id="hintInline" class="hint-inline"></span>
      </div>

      <div class="right">
        <span id="countTxt">Marker: 0</span>
      </div>
    </div>

    <div class="stat2">
      <div class="last-left">
        <span>Letztes Update:</span>
        <span id="syncIcon" class="sync" title="Aktualisiere…">⟳</span>
      </div>
      <div id="lastTxt">–</div>
    </div>

    <div class="stat3">
      <div>Aktiv: <span id="impactActive" class="pulse">–</span></div>
      <div>Punkte 10m: <span id="impactPoints10" class="pulse">–</span></div>
      <div>Marker: <span id="impactMarkers" class="pulse">0</span></div>
    </div>
  </div>

  <script>
    // --- Debug ---
    const DEBUG = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

    function logDebug(...args) { if (DEBUG) console.log("[DEBUG]", new Date().toISOString(), ...args); }
    function logError(code, message, ctx = {}) {
      console.error(`[${code}] ${message}`, { ts: new Date().toISOString(), ...ctx });
    }

    function setSafeTextContent(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text ?? "";
      else if (DEBUG) console.warn(`[DEBUG] Element #${id} nicht gefunden!`);
    }

    // --- D-1 Config (Keys) ---
    const CONFIG = window.ER_CONFIG ?? {
      mapboxToken: "MAPBOX_TOKEN_PLACEHOLDER",
      supabaseUrl: "https://ihpszsoivqcrkkiucjvv.supabase.co",
      supabaseAnonKey: "SUPABASE_KEY_PLACEHOLDER",
    };

    // --- Zeitfenster ---
    const ACTIVE_ONLY_MS = 2 * 60_000;
    const STALE_VISUAL_MS = 2 * 60_000;
    const STALE_MS = 5 * 60_000;
    const PRUNE_EVERY_MS = 10_000;
    const ROUTE_MS = 10 * 60_000;
    const MAX_POINTS = 200;

    // Default View
    const DEFAULT_CENTER = [8.8, 53.1];
    const DEFAULT_ZOOM = 10;

    // --- Routenfarben ---
    const ROUTE_COLORS = ["#c7df3a", "#3bb2d0", "#ff6b6b", "#a55eea", "#4dabf7", "#f06595", "#ffd43b", "#7bed9f"];

    // --- Impact Polling / Backoff ---
    const IMPACT_OK_MS = 10_000;
    const IMPACT_MIN_MS = 5_000;
    const IMPACT_MAX_MS = 60_000;
    const IMPACT_BACKOFF = [5_000, 10_000, 20_000, 40_000, 60_000];

    // --- Marker/Cluster Source IDs ---
    const DRIVERS_SOURCE = "er-drivers";
    const LAYER_CLUSTER_CIRCLE = "er-cluster";
    const LAYER_CLUSTER_COUNT = "er-cluster-count";
    const LAYER_POINTS = "er-points";
    const LAYER_POINTS_SELECTED = "er-points-selected";

    // --- D-2 Settings ---
    const BBOX_DEBOUNCE_MS = 350;
    const BBOX_LIMIT_LATEST = 800;        // jetzt: unique per driver -> kann höher
    const BBOX_LIMIT_ROUTE_POINTS = 4000;
    const BBOX_PAD_FACTOR = 0.15;

    // --- D-2.1 Realtime Watchdog ---
    const RT_WATCHDOG_MS = 8_000;
    const RT_STALE_MS = 12_000;
    const RT_RECONNECT_BACKOFF = [1000, 2000, 5000, 10000, 20000];
    let rtWatchdogTimer = null;
    let rtReconnectIdx = 0;
    let rtLastOkAt = 0;
    let rtLastStatus = "INIT";
    let rtConnecting = false;

    function debounce(fn, waitMs) {
      let t = null;
      return (...args) => {
        if (t) clearTimeout(t);
        t = setTimeout(() => fn(...args), waitMs);
      };
    }

    function normalizeCutoff(cutoffOverride, fallbackIso) {
      if (!cutoffOverride) return fallbackIso;
      if (typeof cutoffOverride === "number") return new Date(cutoffOverride).toISOString();
      return String(cutoffOverride);
    }

    function normId(v) { return String(v ?? "").trim().toLowerCase(); }

    function getColorForDriver(driverKey) {
      let hash = 0;
      for (let i = 0; i < driverKey.length; i++) hash = driverKey.charCodeAt(i) + ((hash << 5) - hash);
      const index = Math.abs(hash) % ROUTE_COLORS.length;
      return ROUTE_COLORS[index];
    }

    function isPanelOpen() {
      const panel = document.querySelector(".panel");
      return panel && !panel.classList.contains("collapsed");
    }
    function isTabVisible() { return document.visibilityState === "visible"; }
    function shouldPollImpact() { return isPanelOpen() && isTabVisible(); }

    function showHint(msg) {
      if (!isPanelOpen()) return;
      const el = document.getElementById("hintInline");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
    }
    function hideHint() {
      const el = document.getElementById("hintInline");
      if (!el) return;
      el.classList.remove("show");
      el.textContent = "";
    }

    function setRealtimeState(state) {
      const rtDot = document.getElementById("rtDot");
      const rtTxt = document.getElementById("rtTxt");
      if (rtDot) rtDot.classList.toggle("on", state === "AN");
      if (rtTxt) rtTxt.textContent = "Realtime: " + (state === "AN" ? "AN" : state === "RECONNECT" ? "RECONNECT" : "AUS");
    }

    function setLast(ts = new Date()) { setSafeTextContent("lastTxt", ts.toLocaleString("de-DE")); }
    function setCount(n) { setSafeTextContent("countTxt", "Marker: " + n); }

    function setSync(on) {
      const el = document.getElementById("syncIcon");
      if (!el) return;
      el.classList.toggle("on", !!on);
    }
    function pulse(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 420);
    }

    // C-M3 helpers
    function formatAge(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      if (s < 60) return `vor ${s} Sek.`;
      const m = Math.floor(s / 60);
      if (m < 60) return `vor ${m} Min.`;
      const h = Math.floor(m / 60);
      if (h < 48) return `vor ${h} Std.`;
      const d = Math.floor(h / 24);
      return `vor ${d} Tg.`;
    }
    async function copyText(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      } catch (_) {
        return false;
      }
    }

    // --- Supabase + State ---
    let sb = null;
    let map = null;
    let channel = null;

    const positions = new Map();
    const routePoints = new Map();

    let routesReady = false;
    let routesVisible = true;
    let activeOnlyMode = false;

    let currentFilter = "";
    let currentFilterKey = "";

    // Impact state
    let impactTimer = null;
    let impactInFlight = false;
    let impactBackoffIdx = 0;
    let lastImpactOkAt = 0;

    // Popup
    let markerPopup = null;

    // D-2: request sequencing
    let latestFetchSeq = 0;
    let routeFetchSeq = 0;

    // D-2: map listeners refs for cleanup
    let onMoveEnd = null;
    let onZoomEnd = null;

    function validateConfigOrFail() {
      try {
        if (!CONFIG?.mapboxToken || !String(CONFIG.mapboxToken).startsWith("pk.")) {
          showHint("Mapbox Token fehlt.");
          logError("ERR_CONFIG_MAPBOX", "mapboxToken missing/invalid", { mapboxToken: CONFIG?.mapboxToken });
          return false;
        }
        const url = String(CONFIG?.supabaseUrl || "");
        if (!/^https?:\/\/.+/i.test(url)) {
          showHint("Supabase URL ungültig.");
          logError("ERR_CONFIG_SUPABASE_URL", "supabaseUrl must be http/https", { supabaseUrl: url });
          return false;
        }
        if (!CONFIG?.supabaseAnonKey || String(CONFIG.supabaseAnonKey).length < 20) {
          showHint("Supabase Key fehlt.");
          logError("ERR_CONFIG_SUPABASE_KEY", "supabaseAnonKey missing/invalid", { len: String(CONFIG?.supabaseAnonKey || "").length });
          return false;
        }
        return true;
      } catch (e) {
        logError("ERR_CONFIG_UNKNOWN", e?.message || String(e));
        return false;
      }
    }

    function getBoundsBBoxPadded() {
      if (!map) return null;
      const b = map.getBounds();
      if (!b) return null;

      const west = b.getWest();
      const south = b.getSouth();
      const east = b.getEast();
      const north = b.getNorth();

      const dx = (east - west) * BBOX_PAD_FACTOR;
      const dy = (north - south) * BBOX_PAD_FACTOR;

      return { west: west - dx, south: south - dy, east: east + dx, north: north + dy };
    }

    function isInBbox(bb, lng, lat) {
      if (!bb) return true;
      return lng >= bb.west && lng <= bb.east && lat >= bb.south && lat <= bb.north;
    }

    function isValidLatLng(lat, lng) {
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;
      if (lat < -90 || lat > 90) return false;
      if (lng < -180 || lng > 180) return false;
      return true;
    }

    function updateSelectedLayerFilter() {
      if (!map || !map.getLayer(LAYER_POINTS_SELECTED)) return;
      if (currentFilterKey) {
        map.setFilter(LAYER_POINTS_SELECTED, ["all", ["!", ["has", "point_count"]], ["==", ["get", "driverKey"], currentFilterKey]]);
      } else {
        map.setFilter(LAYER_POINTS_SELECTED, ["all", ["!", ["has", "point_count"]], ["==", ["get", "driverKey"], "__none__"]]);
      }
    }

    function refreshDriversSource() {
      if (!map || !map.getSource(DRIVERS_SOURCE)) return;

      const feats = [];
      const now = Date.now();
      const bb = currentFilterKey ? null : getBoundsBBoxPadded();

      for (const [driverKey, p] of positions.entries()) {
        if (!p) continue;
        if (currentFilterKey && driverKey !== currentFilterKey) continue;
        if (!currentFilterKey && bb && !isInBbox(bb, Number(p.lng), Number(p.lat))) continue;

        const age = now - (p.ts || now);
        const stale = age > STALE_VISUAL_MS;

        feats.push({
          type: "Feature",
          properties: { driverKey, rawId: p.rawId, ts: p.ts, stale: stale ? 1 : 0 },
          geometry: { type: "Point", coordinates: [p.lng, p.lat] }
        });
      }

      map.getSource(DRIVERS_SOURCE).setData({ type: "FeatureCollection", features: feats });

      updateSelectedLayerFilter();
      setCount(feats.length);
      setSafeTextContent("impactMarkers", String(feats.length));
      pulse("impactMarkers");
    }

    function openMarkerPopupFromFeature(feature) {
      if (!map || !feature) return;
      if (markerPopup) { markerPopup.remove(); markerPopup = null; }

      const props = feature.properties || {};
      const rawId = props.rawId || props.driverKey || "";
      const ts = Number(props.ts) || Date.now();
      const ageMs = Date.now() - ts;

      const isStale = ageMs > STALE_VISUAL_MS;
      const badgeClass = isStale ? "stale" : "ok";
      const badgeText = isStale ? "Stale" : "Aktiv";

      const root = document.createElement("div");

      const title = document.createElement("div");
      title.className = "er-pop-title";
      title.innerHTML = `<span>Fahrer</span><span class="er-badge ${badgeClass}">${badgeText}</span>`;

      const sub = document.createElement("div");
      sub.className = "er-pop-sub";
      sub.innerHTML = `<span style="font-weight:700;">${rawId}</span><span>${formatAge(ageMs)}</span>`;

      const actions = document.createElement("div");
      actions.className = "er-pop-actions";

      const btnRoute = document.createElement("button");
      btnRoute.className = "er-pop-btn primary";
      btnRoute.type = "button";
      btnRoute.textContent = "Route anzeigen";

      const btnCopy = document.createElement("button");
      btnCopy.className = "er-pop-btn";
      btnCopy.type = "button";
      btnCopy.textContent = "Kopieren";

      actions.appendChild(btnRoute);
      actions.appendChild(btnCopy);

      root.appendChild(title);
      root.appendChild(sub);
      root.appendChild(actions);

      btnRoute.addEventListener("click", async (ev) => {
        ev.preventDefault();
        ev.stopPropagation();

        if (!routesVisible) {
          routesVisible = true;
          if (map && map.getLayer("er-routes-line")) map.setLayoutProperty("er-routes-line", "visibility", "visible");
          const b = document.getElementById("btnToggleRoutes");
          if (b) b.textContent = "Ausblenden";
        }

        const df = document.getElementById("driverFilter");
        if (df) df.value = rawId;

        currentFilter = String(rawId).trim();
        currentFilterKey = normId(currentFilter);
        updateSelectedLayerFilter();

        const c = feature.geometry?.coordinates;
        if (Array.isArray(c) && c.length === 2) map.easeTo({ center: c, zoom: 14, duration: 550 });

        await fetchLatest().catch(() => {});
        await fetchRouteHistory().catch(() => {});
        refreshDriversSource();
        onVisibilityOrPanelChange();
      });

      btnCopy.addEventListener("click", async (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const ok = await copyText(String(rawId));
        showHint(ok ? "Driver ID kopiert." : "Kopieren nicht möglich.");
        setTimeout(() => hideHint(), 1200);
      });

      const coords = feature.geometry?.coordinates;
      if (!Array.isArray(coords) || coords.length !== 2) return;

      markerPopup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true, offset: 14 })
        .setLngLat(coords)
        .setDOMContent(root)
        .addTo(map);
    }

    function clearImpactTimer() {
      if (impactTimer) { clearTimeout(impactTimer); impactTimer = null; }
    }
    function scheduleImpactPoll(immediate = false) {
      clearImpactTimer();
      if (!shouldPollImpact()) return;

      const base = IMPACT_OK_MS;
      const backoff = IMPACT_BACKOFF[impactBackoffIdx] ?? IMPACT_MAX_MS;
      const nextMs = immediate ? IMPACT_MIN_MS : Math.max(base, backoff);

      impactTimer = setTimeout(() => { fetchImpactOnce().catch(() => {}); }, nextMs);
    }
    function onVisibilityOrPanelChange() {
      if (shouldPollImpact()) {
        fetchImpactOnce().catch(() => {});
        scheduleImpactPoll(false);
      } else {
        clearImpactTimer();
      }
    }

    async function fetchImpactOnce() {
      if (!shouldPollImpact()) return;
      if (impactInFlight) return;

      impactInFlight = true;
      setSync(true);

      try {
        const { data, error } = await sb.rpc("get_live_impact", { active_minutes: 2, points_minutes: 10 });
        if (error) throw new Error(error.message);

        const row = Array.isArray(data) ? data[0] : data;
        if (!row) throw new Error("RPC returned no rows");

        const active = (row.active_drivers ?? 0);
        const points = (row.points_window ?? 0);

        setSafeTextContent("impactActive", String(active));
        setSafeTextContent("impactPoints10", String(points));
        pulse("impactActive");
        pulse("impactPoints10");

        lastImpactOkAt = Date.now();
        impactBackoffIdx = 0;
        setLast(new Date());
      } catch (e) {
        logError("ERR_RPC_IMPACT", e?.message || String(e));
        showHint("Impact temporär nicht verfügbar.");
        impactBackoffIdx = Math.min(impactBackoffIdx + 1, IMPACT_BACKOFF.length - 1);
      } finally {
        impactInFlight = false;
        setSync(false);
      }

      scheduleImpactPoll();
    }

    function refreshRoutesSource() {
      if (!map || !routesReady || !map.getSource("er-routes")) return;

      const features = [];
      for (const [driverKey, pts] of routePoints.entries()) {
        if (!pts || pts.length < 2) continue;
        if (currentFilterKey && driverKey !== currentFilterKey) continue;

        features.push({
          type: "Feature",
          properties: { driverKey, color: getColorForDriver(driverKey) },
          geometry: { type: "LineString", coordinates: pts.map(p => [p.lng, p.lat]) }
        });
      }

      map.getSource("er-routes").setData({ type: "FeatureCollection", features });

      if (!isPanelOpen()) return;
      if (features.length === 0 && currentFilterKey) showHint("Keine Route für diesen Fahrer.");
      else if (features.length === 0) showHint("Keine Routen verfügbar.");
      else hideHint();
    }

    // --- Mapbox ---
    function initMapbox() {
      mapboxgl.accessToken = CONFIG.mapboxToken;

      const m = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/streets-v12",
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,
      });

      m.addControl(new mapboxgl.NavigationControl(), "bottom-right");

      m.on("load", () => {
        hideHint();

        if (!m.getSource("er-routes")) {
          m.addSource("er-routes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

          m.addLayer({
            id: "er-routes-line",
            type: "line",
            source: "er-routes",
            layout: {
              "line-join": "round",
              "line-cap": "round",
              "visibility": routesVisible ? "visible" : "none"
            },
            paint: { "line-width": 4, "line-opacity": 0.75, "line-color": ["get", "color"] }
          });

          m.on("mouseenter", "er-routes-line", () => { m.getCanvas().style.cursor = "pointer"; });
          m.on("mouseleave", "er-routes-line", () => { m.getCanvas().style.cursor = ""; });
        }

        if (!m.getSource(DRIVERS_SOURCE)) {
          m.addSource(DRIVERS_SOURCE, {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
            cluster: true,
            clusterRadius: 48,
            clusterMaxZoom: 14
          });

          m.addLayer({
            id: LAYER_CLUSTER_CIRCLE,
            type: "circle",
            source: DRIVERS_SOURCE,
            filter: ["has", "point_count"],
            paint: {
              "circle-radius": ["step", ["get", "point_count"], 16, 25, 20, 50, 26, 100, 32],
              "circle-color": "rgba(199,223,58,0.70)",
              "circle-stroke-width": 1,
              "circle-stroke-color": "rgba(17,24,37,0.35)"
            }
          });

          m.addLayer({
            id: LAYER_CLUSTER_COUNT,
            type: "symbol",
            source: DRIVERS_SOURCE,
            filter: ["has", "point_count"],
            layout: {
              "text-field": ["get", "point_count_abbreviated"],
              "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Bold"],
              "text-size": 12
            },
            paint: { "text-color": "#0b0f14" }
          });

          m.addLayer({
            id: LAYER_POINTS,
            type: "circle",
            source: DRIVERS_SOURCE,
            filter: ["all", ["!", ["has", "point_count"]]],
            paint: {
              "circle-radius": 7,
              "circle-color": [
                "case",
                ["==", ["get", "stale"], 1], "rgba(199,223,58,0.35)",
                "rgba(199,223,58,0.92)"
              ],
              "circle-opacity": [
                "case",
                ["==", ["get", "stale"], 1], 0.65,
                1
              ],
              "circle-stroke-width": 2,
              "circle-stroke-color": "rgba(199,223,58,0.35)"
            }
          });

          m.addLayer({
            id: LAYER_POINTS_SELECTED,
            type: "circle",
            source: DRIVERS_SOURCE,
            filter: ["all", ["!", ["has", "point_count"]], ["==", ["get", "driverKey"], "__none__"]],
            paint: {
              "circle-radius": 9,
              "circle-color": [
                "case",
                ["==", ["get", "stale"], 1], "rgba(199,223,58,0.75)",
                "rgba(199,223,58,0.98)"
              ],
              "circle-stroke-width": 3,
              "circle-stroke-color": "rgba(255,255,255,0.35)"
            }
          });

          m.on("click", LAYER_CLUSTER_CIRCLE, (e) => {
            const f = e.features?.[0];
            if (!f) return;
            const clusterId = f.properties.cluster_id;
            const source = m.getSource(DRIVERS_SOURCE);
            source.getClusterExpansionZoom(clusterId, (err, zoom) => {
              if (err) return;
              m.easeTo({ center: f.geometry.coordinates, zoom, duration: 550 });
            });
          });

          m.on("click", LAYER_POINTS, async (e) => {
            const f = e.features?.[0];
            if (!f) return;

            const rawId = f.properties?.rawId ?? "";
            const df = document.getElementById("driverFilter");
            if (df) df.value = rawId;

            currentFilter = String(rawId).trim();
            currentFilterKey = normId(currentFilter);
            updateSelectedLayerFilter();

            m.easeTo({ center: f.geometry.coordinates, zoom: 14, duration: 650 });
            openMarkerPopupFromFeature(f);

            await fetchLatest().catch(() => {});
            await fetchRouteHistory().catch(() => {});
            refreshDriversSource();
            onVisibilityOrPanelChange();
          });

          m.on("mouseenter", LAYER_CLUSTER_CIRCLE, () => { m.getCanvas().style.cursor = "pointer"; });
          m.on("mouseleave", LAYER_CLUSTER_CIRCLE, () => { m.getCanvas().style.cursor = ""; });
          m.on("mouseenter", LAYER_POINTS, () => { m.getCanvas().style.cursor = "pointer"; });
          m.on("mouseleave", LAYER_POINTS, () => { m.getCanvas().style.cursor = ""; });
        }

        const btn = document.getElementById("btnToggleRoutes");
        if (btn) btn.textContent = routesVisible ? "Ausblenden" : "Einblenden";

        routesReady = true;
        refreshDriversSource();
        refreshRoutesSource();
      });

      m.on("error", (e) => {
        logError("ERR_MAPBOX", "Mapbox error", { err: e?.error || e });
        showHint("Karte konnte nicht geladen werden.");
      });

      return m;
    }

    // =========================
    // D-2.2: Latest per Driver
    // =========================
    // Wir lesen ab jetzt aus:
    //   public.v_live_positions_latest
    // -> Kein Limit-Verdrängen mehr, weil pro driver_id nur 1 Zeile geliefert wird.
    async function fetchLatest(cutoffOverride) {
      const seq = ++latestFetchSeq;

      const now = Date.now();
      const fallbackIso = new Date(now - (activeOnlyMode ? ACTIVE_ONLY_MS : STALE_MS)).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);

      // Follow: latest für genau diesen Fahrer
      if (currentFilterKey) {
        const idExact = String(currentFilter || "").trim();
        if (!idExact) return;

        const { data, error } = await sb
          .from("v_live_positions_latest")
          .select("driver_id, lat, lng, updated_at")
          .ilike("driver_id", idExact)
          .gte("updated_at", cutoffIso)
          .limit(1);

        if (seq !== latestFetchSeq) return;

        if (error) {
          logError("ERR_FETCH_LATEST_FOLLOW_V", error.message, { cutoffIso, idExact });
          showHint("Fehler beim Laden.");
          return;
        }

        const row = data?.[0] ?? null;
        if (!row) {
          showHint("Kein Signal für diesen Fahrer.");
          positions.clear();
          refreshDriversSource();
          return;
        }

        const rawId = (row.driver_id ?? "").toString();
        const key = normId(rawId);
        const lat = Number(row.lat);
        const lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) {
          logError("ERR_DATA_LATLNG", "Invalid lat/lng (follow)", { rawId, lat, lng });
          return;
        }

        const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
        if (Date.now() - ts > STALE_MS) return;

        positions.clear();
        positions.set(key, { rawId, lng, lat, ts });

        map.easeTo({ center: [lng, lat], zoom: 14, duration: 600 });
        setLast(new Date());
        refreshDriversSource();
        return;
      }

      // All: BBox + latest per driver
      const bb = getBoundsBBoxPadded();
      if (!bb) return;

      const { data, error } = await sb
        .from("v_live_positions_latest")
        .select("driver_id, lat, lng, updated_at")
        .gte("updated_at", cutoffIso)
        .gte("lat", bb.south)
        .lte("lat", bb.north)
        .gte("lng", bb.west)
        .lte("lng", bb.east)
        .limit(BBOX_LIMIT_LATEST);

      if (seq !== latestFetchSeq) return;

      if (error) {
        logError("ERR_FETCH_LATEST_BBOX_V", error.message, { cutoffIso, bb, limit: BBOX_LIMIT_LATEST });
        showHint("Fehler beim Laden.");
        return;
      }

      positions.clear();

      for (const row of data || []) {
        const rawId = (row?.driver_id ?? "").toString();
        const key = normId(rawId);
        if (!key) continue;

        const lat = Number(row.lat);
        const lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) continue;

        const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
        if (Date.now() - ts > STALE_MS) continue;

        positions.set(key, { rawId: row.driver_id, lng, lat, ts });
      }

      setLast(new Date());
      refreshDriversSource();
    }

    // --- Route history (bleibt live_positions) ---
    async function fetchRouteHistory(cutoffOverride) {
      const seq = ++routeFetchSeq;

      const now = Date.now();
      const fallbackIso = new Date(now - (activeOnlyMode ? ACTIVE_ONLY_MS : ROUTE_MS)).toISOString();
      const cutoffIso = normalizeCutoff(cutoffOverride, fallbackIso);

      routePoints.clear();

      if (currentFilterKey) {
        const idExact = String(currentFilter || "").trim();
        if (!idExact) { refreshRoutesSource(); return; }

        const { data, error } = await sb
          .from("live_positions")
          .select("driver_id, lat, lng, updated_at")
          .ilike("driver_id", idExact)
          .gte("updated_at", cutoffIso)
          .order("updated_at", { ascending: true })
          .limit(MAX_POINTS);

        if (seq !== routeFetchSeq) return;

        if (error) {
          logError("ERR_FETCH_ROUTE_FOLLOW", error.message, { cutoffIso, idExact });
          return;
        }

        const key = normId(idExact);
        const arr = [];
        for (const row of data || []) {
          const lat = Number(row.lat), lng = Number(row.lng);
          if (!isValidLatLng(lat, lng)) continue;
          const ts = row.updated_at ? new Date(row.updated_at).getTime() : null;
          if (!ts) continue;
          arr.push({ lng, lat, ts });
        }

        const minTs = now - ROUTE_MS;
        while (arr.length && arr[0].ts < minTs) arr.shift();
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
        if (arr.length >= 2) routePoints.set(key, arr);

        refreshRoutesSource();
        return;
      }

      const bb = getBoundsBBoxPadded();
      if (!bb) { refreshRoutesSource(); return; }

      const { data, error } = await sb
        .from("live_positions")
        .select("driver_id, lat, lng, updated_at")
        .gte("updated_at", cutoffIso)
        .gte("lat", bb.south)
        .lte("lat", bb.north)
        .gte("lng", bb.west)
        .lte("lng", bb.east)
        .order("driver_id", { ascending: true })
        .order("updated_at", { ascending: true })
        .limit(BBOX_LIMIT_ROUTE_POINTS);

      if (seq !== routeFetchSeq) return;

      if (error) {
        logError("ERR_FETCH_ROUTE_BBOX", error.message, { cutoffIso, bb, limit: BBOX_LIMIT_ROUTE_POINTS });
        return;
      }

      for (const row of data || []) {
        const driverKey = normId(row?.driver_id);
        if (!driverKey) continue;

        const lat = Number(row.lat);
        const lng = Number(row.lng);
        if (!isValidLatLng(lat, lng)) continue;

        const ts = row.updated_at ? new Date(row.updated_at).getTime() : null;
        if (!ts) continue;

        const arr = routePoints.get(driverKey) ?? [];
        arr.push({ lng, lat, ts });
        routePoints.set(driverKey, arr);
      }

      for (const [driverKey, arr] of routePoints.entries()) {
        const minTs = now - ROUTE_MS;
        while (arr.length && arr[0].ts < minTs) arr.shift();
        if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);

        const last = arr[arr.length - 1];
        if (!last || (now - last.ts > STALE_MS) || arr.length < 2) routePoints.delete(driverKey);
      }

      refreshRoutesSource();
    }

    // --- Realtime subscribe (bounds-aware) ---
    function subscribe() {
      if (!sb) return;
      if (rtConnecting) return;
      rtConnecting = true;

      try { if (channel) sb.removeChannel(channel); } catch (_) {}

      channel = sb.channel("live_positions_map")
        .on("postgres_changes", { event: "*", schema: "public", table: "live_positions" }, (payload) => {
          if (payload?.eventType === "INSERT" || payload?.eventType === "UPDATE") {
            upsertRealtime(payload.new);
          } else if (payload?.eventType === "DELETE") {
            const key = normId(payload.old?.driver_id);
            if (key) {
              positions.delete(key);
              routePoints.delete(key);
              refreshDriversSource();
              refreshRoutesSource();
            }
          }
        })
        .subscribe((status) => {
          rtLastStatus = status;

          if (status === "SUBSCRIBED") {
            rtLastOkAt = Date.now();
            rtReconnectIdx = 0;
            setRealtimeState("AN");
          } else if (status === "CLOSED" || status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            setRealtimeState("RECONNECT");
          } else {
            setRealtimeState("AUS");
          }

          logDebug("Realtime status:", status);
          rtConnecting = false;
        });

      startRealtimeWatchdog();
    }

    function startRealtimeWatchdog() {
      if (rtWatchdogTimer) return;
      rtWatchdogTimer = setInterval(() => {
        if (!isTabVisible()) return;
        const now = Date.now();

        const age = now - (rtLastOkAt || 0);
        const isBad = rtLastStatus !== "SUBSCRIBED";
        const tooLong = age > RT_STALE_MS;

        if (isBad && tooLong) {
          const wait = RT_RECONNECT_BACKOFF[Math.min(rtReconnectIdx, RT_RECONNECT_BACKOFF.length - 1)];
          rtReconnectIdx++;
          setRealtimeState("RECONNECT");
          logError("WARN_RT_RECONNECT", "Realtime not subscribed, reconnecting", { status: rtLastStatus, ageMs: age, backoffMs: wait });

          setTimeout(() => { try { subscribe(); } catch (_) {} }, wait);
        }
      }, RT_WATCHDOG_MS);
    }

    function stopRealtimeWatchdog() {
      if (rtWatchdogTimer) { clearInterval(rtWatchdogTimer); rtWatchdogTimer = null; }
    }

    function upsertRealtime(row) {
      if (!map || !row?.driver_id) return;

      const rawId = (row.driver_id ?? "").toString();
      const driverKey = normId(rawId);
      if (!driverKey) return;

      const lat = Number(row.lat);
      const lng = Number(row.lng);
      if (!isValidLatLng(lat, lng)) return;

      const ts = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
      if (Date.now() - ts > STALE_MS) return;

      if (currentFilterKey) {
        if (driverKey !== currentFilterKey) return;
        positions.set(driverKey, { rawId, lng, lat, ts });
      } else {
        const bb = getBoundsBBoxPadded();
        if (bb && !isInBbox(bb, lng, lat)) return;
        positions.set(driverKey, { rawId, lng, lat, ts });
      }

      const now = Date.now();
      const minTs = now - ROUTE_MS;
      const arr = routePoints.get(driverKey) ?? [];
      arr.push({ lng, lat, ts });
      while (arr.length && arr[0].ts < minTs) arr.shift();
      if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
      routePoints.set(driverKey, arr);

      refreshDriversSource();
      refreshRoutesSource();
      setLast(new Date());

      const sinceOk = Date.now() - (lastImpactOkAt || 0);
      if (shouldPollImpact() && sinceOk > 3000) fetchImpactOnce().catch(() => {});
    }

    // --- Prune ---
    const pruneTimer = setInterval(() => {
      if (positions.size === 0) return;
      const now = Date.now();
      let changed = false;

      for (const [driverKey, p] of positions.entries()) {
        const ts = p?.ts || 0;
        if (now - ts > STALE_MS) {
          positions.delete(driverKey);
          routePoints.delete(driverKey);
          changed = true;
        }
      }

      if (changed) {
        refreshDriversSource();
        refreshRoutesSource();
      }
    }, PRUNE_EVERY_MS);

    // --- Init ---
    function initMap() {
      if (!validateConfigOrFail()) return;

      sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

      map = initMapbox();
      if (!map) return;

      map.on("click", () => {
        if (markerPopup) { markerPopup.remove(); markerPopup = null; }
      });

      document.getElementById("panelTitle")?.addEventListener("click", () => {
        const panel = document.querySelector(".panel");
        panel?.classList.toggle("collapsed");
        if (panel?.classList.contains("collapsed")) hideHint();
        onVisibilityOrPanelChange();
      });

      document.getElementById("btnApply")?.addEventListener("click", async () => {
        const df = document.getElementById("driverFilter");
        currentFilter = df?.value?.trim() || "";
        currentFilterKey = normId(currentFilter);
        updateSelectedLayerFilter();

        await fetchLatest();
        await fetchRouteHistory();
        refreshDriversSource();
        onVisibilityOrPanelChange();
      });

      document.getElementById("btnAll")?.addEventListener("click", async () => {
        const df = document.getElementById("driverFilter");
        if (df) df.value = "";

        currentFilter = "";
        currentFilterKey = "";
        updateSelectedLayerFilter();

        if (markerPopup) { markerPopup.remove(); markerPopup = null; }

        map.easeTo({ center: DEFAULT_CENTER, zoom: DEFAULT_ZOOM, duration: 650 });

        await fetchLatest();
        await fetchRouteHistory();
        refreshDriversSource();
        onVisibilityOrPanelChange();
      });

      document.getElementById("btnToggleRoutes")?.addEventListener("click", () => {
        routesVisible = !routesVisible;
        if (map && map.getLayer("er-routes-line")) {
          map.setLayoutProperty("er-routes-line", "visibility", routesVisible ? "visible" : "none");
        }
        const btn = document.getElementById("btnToggleRoutes");
        if (btn) btn.textContent = routesVisible ? "Ausblenden" : "Einblenden";
      });

      document.getElementById("btnActiveOnly")?.addEventListener("click", async () => {
        activeOnlyMode = !activeOnlyMode;
        const btn = document.getElementById("btnActiveOnly");
        if (btn) btn.textContent = activeOnlyMode ? "Alle anzeigen" : "Aktive";

        if (activeOnlyMode) showHint("Nur aktive Fahrer.");
        else showHint("Alle Fahrer.");

        await fetchLatest();
        await fetchRouteHistory();
        refreshDriversSource();
        onVisibilityOrPanelChange();
      });

      document.addEventListener("visibilitychange", () => {
        onVisibilityOrPanelChange();
      });

      const debouncedReload = debounce(async () => {
        if (!map) return;
        if (currentFilterKey) return;
        await fetchLatest().catch(() => {});
        await fetchRouteHistory().catch(() => {});
      }, BBOX_DEBOUNCE_MS);

      onMoveEnd = debouncedReload;
      onZoomEnd = debouncedReload;
      map.on("moveend", onMoveEnd);
      map.on("zoomend", onZoomEnd);

      fetchLatest().catch(e => logError("ERR_INIT_FETCH_LATEST", e?.message || String(e)));
      fetchRouteHistory().catch(e => logError("ERR_INIT_FETCH_ROUTE", e?.message || String(e)));

      subscribe();
      onVisibilityOrPanelChange();
    }

    // --- Cleanup (D-2.1 Hygiene) ---
    function cleanup() {
      try { clearInterval(pruneTimer); } catch (_) {}
      try { clearImpactTimer(); } catch (_) {}
      try { stopRealtimeWatchdog(); } catch (_) {}

      try {
        if (map && onMoveEnd) map.off("moveend", onMoveEnd);
        if (map && onZoomEnd) map.off("zoomend", onZoomEnd);
      } catch (_) {}

      try { if (sb && channel) sb.removeChannel(channel); } catch (_) {}
      try { if (markerPopup) markerPopup.remove(); } catch (_) {}
      try { if (map) map.remove(); } catch (_) {}
    }

    window.addEventListener("beforeunload", cleanup);
    window.addEventListener("pagehide", cleanup);

    document.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
